name: Bug report
description: Something does not work as described
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not attach confidential models, project files, secrets, keys or tokens.** Describe the problem in words, or reduce it to a small example you can share.
        Security problems: use the private reporting link on the Security tab, not this form.
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `platform --version`, or the version shown in the page header.
    validations:
      required: true
  - type: dropdown
    id: image
    attributes:
      label: Image
      options:
        - platform
        - platform-tools
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and container runtime
      description: For example "Ubuntu 24.04, Docker 27" or "Windows 11, Docker Desktop".
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Paste the "Copy diagnostics" text from the page's status view, if you have it. It holds versions and environment only, no project content.
